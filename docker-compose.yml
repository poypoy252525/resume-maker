services:
  server:
    build: ./server
    restart: always
    env_file:
      - ./server/.env
    environment:
      - POSTGRES_PORT=5432
    volumes:
      - static:/app/static
      - media:/app/media
    depends_on:
      - db

  db:
    image: postgres:15.17-alpine3.22
    env_file:
      - ./server/.env
    restart: always
    volumes:
      - postgres_db:/var/lib/postgresql/data

  nginx:
    image: nginx
    ports:
      - 80:80
    volumes:
      - static:/app/static
      - media:/app/media
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

volumes:
  postgres_db:
  static:
  media:
