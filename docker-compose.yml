services:
  server:
    build: ./server
    restart: always
    env_file:
      - ./server/.env
    volumes:
      - static:/app/static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Ports moved to docker-compose.override.yml for local development

  celery:
    build: ./server
    command: celery -A config worker -l info --concurrency=10
    restart: always
    env_file:
      - ./server/.env
    environment:
      - POSTGRES_PORT=5432
    volumes:
      - static:/app/static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15.17-alpine3.22
    env_file:
      - ./server/.env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_db:/var/lib/postgresql/data
    # Ports moved to docker-compose.override.yml for local development

  nginx:
    image: nginx
    ports:
      - 8200:80
    volumes:
      - static:/app/static
      - media:/app/media
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

volumes:
  postgres_db:
  static:
  media:
