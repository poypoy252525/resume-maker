server {
    listen 80;
    server_name resume.carljeffersondelfin.com;

    # 1. Frontend (Vite/React Container)
    location / {
        proxy_pass http://localhost:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend, Static, and Media (Internal Nginx Container)
    # Note: We point to 8200 because the 'nginx' service in Docker 
    # handles the alias for static/media and proxies to Django.
    location ~ ^/(api|static|media)/ {
        proxy_pass http://localhost:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase body size for file uploads (resumes)
        client_max_body_size 10M;
    }
}
